name: Validate & Build Catalog Manifest

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'texts/**'
      - 'books/**'
      - 'gamebooks/**'
      - 'rpg-gamebooks/**'
      - 'images/**'
      - 'scripts/build-manifest.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate content & regenerate manifest.json
        run: node scripts/build-manifest.mjs

      - name: Commit updated manifest.json if changed
        run: |
          if [ -n "$(git status --porcelain manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: update catalog manifest.json"
            git push
          fi
